<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Passaporte para o Caos</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages: pages created after publishing (new Quadros/episodes) open through /abrir.
  (function () {
    var l = window.location;
    if (l.pathname.indexOf("/abrir") === 0) return;
    l.replace("/abrir?p=" + encodeURIComponent(l.pathname + l.search + l.hash));
  })();
</script>
</head>
<body><p>Abrindo…</p></body>
</html>
